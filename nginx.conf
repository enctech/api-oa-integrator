events {}

http {
    # Plain HTTP: redirect everything to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host:3030$request_uri;
    }

    server {
        listen 3030 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/certificate.pem;
        ssl_certificate_key /etc/nginx/ssl/private-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Route to the web app
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route to the backend API.
        # No trailing slash on proxy_pass: the /api/ prefix is preserved and
        # the backend serves its routes under an "api/" group.
        location /api/ {
            proxy_pass http://backend:1323;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

events {}

http {
    server {
        listen 80;
#         listen 3030 ssl;
#         server_name localhost;
#
#         ssl_certificate /etc/nginx/ssl/certificate.pem;
#         ssl_certificate_key /etc/nginx/ssl/private-key.pem;
#
#         ssl_protocols TLSv1.2 TLSv1.3;
#         ssl_prefer_server_ciphers on;
#         ssl_ciphers HIGH:!aNULL:!MD5;

        # Route to the web app
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # S&B is configured against the legacy /oa/ path, from before the
        # backend moved its routes under an "api/" group. Without this, /oa/
        # falls through to "location /" and the SPA returns index.html with
        # 200 OK for every request - so job notifications are accepted and
        # discarded, and any credentials appear to work.
        #
        # The trailing /api/oa/ rewrites the prefix: /oa/X -> /api/oa/X.
        # ^~ stops nginx evaluating the regex location below, so genuine OA
        # calls on the correct path are proxied rather than rejected.
        location ^~ /oa/ {
            proxy_pass http://backend:1323/api/oa/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route to the backend API
        location ^~ /api/ {
            proxy_pass http://backend:1323;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # An OA call on any other path is a misconfigured integration URL.
        # Without this it falls through to "location /", where the SPA
        # answers index.html with 200 - so a wrong URL is indistinguishable
        # from a working one and the caller has no way to notice.
        # Reached only when the ^~ prefixes above did not match.
        location ~ AuthorizationService3rdParty {
            add_header Content-Type text/plain always;
            return 404 "Not found. The OA endpoint is /oa/AuthorizationService3rdParty/...\n";
        }
    }
}

events {}

http {
    server {
        # HTTP stays enabled alongside HTTPS rather than redirecting to it.
        # S&B currently calls over http, and some clients drop the body when
        # following a redirect on PUT/POST, so forcing one could silently
        # break job delivery.
        listen 80;

        # 3030 as well as 443: 3030 is the port this deployment historically
        # used for TLS, and both are published by docker-compose.
        listen 443 ssl;
        listen 3030 ssl;

        # Mounted from ./cert (see docker-compose.yaml). Gitignored.
        ssl_certificate     /etc/nginx/ssl/certificate.pem;
        ssl_certificate_key /etc/nginx/ssl/private-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Route to the web app
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route to the backend API
        location /api/ {
            proxy_pass http://backend:1323;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

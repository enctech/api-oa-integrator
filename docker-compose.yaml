# Deploy file. Images are built elsewhere (see docker-compose.build.yaml)
# and pulled here, so there is deliberately no build: key - "up" on the
# server can never silently fall back to compiling locally.
#
#   server:  docker compose pull && docker compose up -d
#   builder: make push
services:
  backend:
    restart: always
    image: ghcr.io/enctech/backend-dwservice:${TAG:-latest-internal}
    container_name: backend
    ports:
      - "1323:1323"
    environment:
      - TZ=Asia/Singapore
      - DATABASE_URL=postgres://postgres:a8mJ!4ug2dvj@db:5432/postgres?sslmode=disable
    depends_on:
      - db
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
  web:
    image: ghcr.io/enctech/web-dwservice:${TAG:-latest-internal}
    container_name: web
    ports:
      - "3000:3000"
    depends_on:
      - backend
  db:
    image: postgres:16
    container_name: db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=a8mJ!4ug2dvj
    ports:
      - '5432:5432'
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "3030:3030"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - web
